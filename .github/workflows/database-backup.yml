name: Encrypted PostgreSQL backup and restore test

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      restore-db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-only-password
          POSTGRES_DB: restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret"; exit 1; }
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || { echo "Missing BACKUP_ENCRYPTION_PASSPHRASE secret"; exit 1; }
      - name: Dump production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/db-backup"
          docker run --rm --network host \
            --env DATABASE_URL \
            --volume "$RUNNER_TEMP/db-backup:/backup" \
            postgres:17 \
            sh -ec 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/production.dump'
          test -s "$RUNNER_TEMP/db-backup/production.dump"
      - name: Encrypt backup and verify encrypted copy
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/db-backup/production.dump" \
            -out "$RUNNER_TEMP/db-backup/production.dump.enc" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/db-backup/production.dump.enc" \
            -out "$RUNNER_TEMP/db-backup/restore-test.dump" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          docker run --rm --network host \
            --volume "$RUNNER_TEMP/db-backup:/backup" \
            postgres:17 pg_restore --list /backup/restore-test.dump >/dev/null
      - name: Restore into temporary PostgreSQL and verify schema
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --volume "$RUNNER_TEMP/db-backup:/backup:ro" \
            --volume "$GITHUB_WORKSPACE/server/scripts:/scripts:ro" \
            postgres:17 sh -ec '
              export PGPASSWORD=restore-only-password
              pg_restore --exit-on-error --no-owner --no-acl \
                --host=127.0.0.1 --username=postgres --dbname=restore_test \
                /backup/restore-test.dump
              schema_restored=$(psql \
                --host=127.0.0.1 --username=postgres --dbname=restore_test --tuples-only --no-align \
                --file=/scripts/verify-restored-schema.sql)
              test "$schema_restored" = t
            '
      - name: Store encrypted backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/db-backup/production.dump.enc
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary plaintext backup files
        if: always()
        run: rm -rf "$RUNNER_TEMP/db-backup"
