name: API uptime and resource links

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check API health and resource download links
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node server/scripts/check-api-links.mjs
